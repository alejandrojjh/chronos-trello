<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrackingTime</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
(function () {
  var KEY = 'chronos';

  function anyRunning(d) {
    return !!(d && d.sessions && Object.keys(d.sessions).length > 0);
  }

  function getActiveUsersText(d) {
    if (!d || !d.sessions) return '';
    var names = [];
    Object.keys(d.sessions).forEach(function(id){
      var s = d.sessions[id];
      if (s && s.n) names.push(s.n); // AHORA LEE LA VERSIÓN MINIFICADA "n"
    });
    if (names.length === 0) return 'Trabajando en esto...';
    return names.join(', ') + ' trabajando...';
  }

  var baseUrl = location.href.replace(/\/[^/]*$/, '');

  window.TrelloPowerUp.initialize({
    'card-buttons': function (t) {
      return t.get('card', 'shared', KEY).then(function(d){
        var running = anyRunning(d);
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/111/111168.png',
          text: running ? '⏹ Detener mi timer' : '▶ Iniciar mi timer',
          callback: function (t) {
            return t.popup({ title:'TrackingTime', url: baseUrl + '/timer.html', height:420 });
          }
        }];
      });
    },

    'card-badges': function (t) {
      return [{
        dynamic: function () {
          return t.get('card', 'shared', KEY).then(function(d){
            var running = anyRunning(d);
            if (!running) return [];
            return {
              text:     getActiveUsersText(d),
              color:    'green',
              refresh:  15,
              callback: function (t) {
                return t.popup({ title: 'TrackingTime', url: baseUrl + '/timer.html', height: 420 });
              }
            };
          }).catch(function() { return []; });
        }
      }];
    },

    'card-detail-badges': function (t) {
      return [{
        dynamic: function () {
          return t.get('card', 'shared', KEY).then(function(d){
            var running = anyRunning(d);
            if (!running) return [];
            return { title: 'TrackingTime', text: getActiveUsersText(d), color: 'green', refresh: 15 };
          }).catch(function() { return []; });
        }
      }];
    },

    'card-back-section': function (t) {
      return {
        title: '', icon: 'https://cdn-icons-png.flaticon.com/512/111/111168.png',
        content: { type: 'iframe', url: t.signUrl(baseUrl + '/timer.html'), height: 230 }
      };
    },

    'board-buttons': function (t) {
      return [{
        text: 'TrackingTime Reports',
        callback: function (t) {
          return t.modal({ title: 'TrackingTime Reports', url: t.signUrl(baseUrl + '/dashboard.html'), fullscreen: false, height: 700 });
        }
      }];
    },

    'show-settings': function (t) {
      return t.popup({ title: 'TrackingTime – Configuración', url: t.signUrl(baseUrl + '/settings.html'), height: 420 });
    }
  });
})();
</script>
</body>
</html>
